; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://platformio.org

[env:Marauder-Mini]
board = esp32dev
board_build.partitions = custom_4Mb_full.csv
build_src_filter = ${env.build_src_filter} +<../boards/marauder-mini>
build_flags =
    ${env.build_flags}
    ${env_4mb.build_flags}
    
    -Iboards/marauder-mini
    
    -D MARAUDER_MINI
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BL=32
    -DTOUCH_CS=-1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -DDEBUG_FREETYPE
    
    -DDEVICE_NAME='"Marauder Mini"'

lib_deps =
    ${env_4mb.lib_deps}

lib_ignore =
    ${env_4mb.lib_ignore}

[env:Marauder-Mini-v2]
extends = env:Marauder-Mini
board_build.partitions = custom_8Mb.csv
build_flags = ${env:Marauder-Mini.build_flags} -DBOARD_HAS_PSRAM -mfix-esp32-psram
build_src_filter = +<*> -<*> +<../boards/marauder-mini>

[env:Marauder-v1]
board = esp32dev
board_build.partitions = custom_4Mb_full.csv
build_src_filter = ${env.build_src_filter} +<../boards/marauder-v1>
build_flags =
    ${env.build_flags}
    ${env_4mb.build_flags}
    -Iboards/marauder-v1
    
    -D MARAUDER_V1
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=128
    -DST7735_GREENTAB3=1
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=17
    -DTFT_DC=16
    -DTFT_RST=5
    -DTFT_BL=4
    -DTOUCH_CS=-1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -DDEBUG_FREETYPE
    -DDEVICE_NAME='"Marauder V1"'

lib_deps =
    ${env_4mb.lib_deps}

lib_ignore =
    ${env_4mb.lib_ignore}

